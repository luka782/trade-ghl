[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-mvp"
version = "0.1.0"
description = "A-share factor research and conservative backtesting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "pyarrow",
    "akshare",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
